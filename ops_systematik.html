<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPS-Systematik</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fa;color:#172033}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #dbe2ea;padding:14px 22px}main{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:16px;margin:10px 0}.code{font-family:ui-monospace,monospace;color:#14528e;font-weight:800}.hit{outline:3px solid #8ec5ff}.rub{margin-top:8px;white-space:pre-wrap}.small{color:#64748b;font-size:13px}</style></head><body><header><strong>OPS-Systematik</strong> · <span id="yr"></span></header><main><div id="out">Lade Systematik …</div></main><script>
const p=new URLSearchParams(location.search),y=p.get("year")||"2026",code=p.get("code")||"";document.getElementById("yr").textContent=y;
function show(){const rows=(window.OPS_SYS||{})[y]||[],n=x=>String(x||"").toLowerCase(),c=n(code);let a=rows.filter(r=>n(r.code)===c||n(r.code).startsWith(c)||c.startsWith(n(r.code)));if(!a.length)a=rows.filter(r=>n(r.code).includes(c));document.getElementById("out").innerHTML=a.map(r=>`<div class="card ${n(r.code)===c?"hit":""}"><div class="code">${r.code}</div><h2>${r.title||""}</h2>${(r.rubrics||[]).map(x=>`<div class="rub"><span class="small">${x[0]}</span> ${x[1]}</div>`).join("")}</div>`).join("")||'<div class="card">Code nicht gefunden.</div>';setTimeout(()=>document.querySelector(".hit")?.scrollIntoView({block:"center"}),30)}
const sc=document.createElement("script");sc.src=`data/ops_${y}.js`;sc.onload=show;sc.onerror=()=>document.getElementById("out").innerHTML='<div class="card">Für diesen Jahrgang ist noch keine OPS-Systematik hinterlegt.</div>';document.head.appendChild(sc);
</script></body></html>
