<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICD-10-GM Systematik</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:30px auto;padding:0 18px}.card{background:white;border:1px solid #dbe3ee;border-radius:14px;padding:20px;margin:12px 0}.code{font:700 20px ui-monospace,monospace;color:#075fae}.muted{color:#65758b}.rub{padding:9px 0;border-top:1px solid #edf1f6}.tag{font-size:12px;font-weight:700;color:#52657a;text-transform:uppercase}a{color:#075fae}</style></head><body><div class="wrap"><div class="muted">Arbeitshilfe Begutachtung MD · ICD-10-GM-Systematik</div><div id="app" class="card">Lade …</div></div><script>const p=new URLSearchParams(location.search),y=p.get("year")||"2026",c=p.get("code")||"";document.write(`<script src="data/icd_${y}.js"><\/script>`)</script><script>const esc=s=>String(s||"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]));const a=(window.ICD_DATA?.[y]||[]),r=a.find(x=>x.code===c);document.title=(c?c+" · ":"")+"ICD-10-GM "+y;if(!r){app.innerHTML="Eintrag nicht gefunden."}else{let chain=[],q=r;while(q){chain.unshift(q);q=a.find(x=>x.code===q.parent)}app.innerHTML=`<div class="muted">ICD-10-GM ${esc(y)}</div><h1><span class="code">${esc(r.code)}</span> ${esc(r.title)}</h1><div>${chain.map(x=>`<a href="?year=${encodeURIComponent(y)}&code=${encodeURIComponent(x.code)}">${esc(x.code)}</a>`).join(" › ")}</div>${r.rubrics.map(x=>`<div class="rub"><div class="tag">${esc(x[0])}</div>${esc(x[1])}</div>`).join("")}${r.children.length?`<div class="rub"><div class="tag">Unterkategorien</div>${r.children.map(cc=>{const z=a.find(x=>x.code===cc);return `<div><a href="?year=${encodeURIComponent(y)}&code=${encodeURIComponent(cc)}">${esc(cc)}</a> ${esc(z?.title||"")}</div>`}).join("")}</div>`:""}`}</script></body></html>
